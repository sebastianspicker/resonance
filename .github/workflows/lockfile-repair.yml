name: Lockfile repair

on:
  push:
    branches: ["agent/static-pages-demo"]
    paths:
      - ".github/workflows/lockfile-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Node 24 lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Regenerate lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install contract
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resonance-node24-lockfile
          path: server/package-lock.json
          if-no-files-found: error
