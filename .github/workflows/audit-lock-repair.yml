name: Audit lock repair

on:
  push:
    branches:
      - agent/static-pages-demo
    paths:
      - .github/workflows/audit-lock-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Repair production advisory lock entries
        working-directory: server
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify clean install
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Verify production audit
        working-directory: server
        run: npm audit --audit-level=high --omit=dev
      - name: Upload repaired lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repaired-server-lockfile
          path: server/package-lock.json
          if-no-files-found: error
